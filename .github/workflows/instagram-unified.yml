name: Instagram Unified Login
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/instagramUnified*'
      - 'server/static.ts'
      - 'script/build*.mjs'
      - 'tests/policyCrawler.test.ts'
      - 'client/src/pages/Privacy.tsx'
      - 'client/src/pages/Terms.tsx'
      - 'client/src/components/InstagramUnifiedView.tsx'
      - 'client/src/pages/client/InstagramUnified.tsx'
      - 'client/src/pages/DataDeletion.tsx'
      - 'tests/instagramUnified*'
      - '.github/workflows/instagram-unified.yml'
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      IG_UNIFIED_TEST_DATABASE_URL: postgres://postgres:testpassword@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npm test
      - run: npm run build
