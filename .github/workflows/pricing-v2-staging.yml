name: Pricing V2 Staging
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/pricingV2.ts'
      - 'shared/pricingFeaturesV2.ts'
      - 'client/src/components/pricing/**'
      - 'client/src/pages/LegacyPricingPreview.tsx'
      - 'client/src/App.tsx'
      - 'tests/pricingFeaturesV2.test.ts'
      - 'server/pricingV2Proposal.ts'
      - 'client/src/components/video-marketing/TermPricingPreview.tsx'
      - 'client/src/pages/SelectPlan.tsx'
      - 'client/src/pages/SelectPlanV2.tsx'
      - 'client/src/lib/planSelection.ts'
      - 'shared/pricingPresentationV2.ts'
      - 'tests/planSelectionV2.test.ts'
      - 'client/src/pages/OraviniLanding.tsx'
      - 'tests/pricingV2.test.ts'
      - 'tests/termPricingPreview.test.ts'
      - '.github/workflows/pricing-v2-staging.yml'
jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VITE_PRICING_V2_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npx tsx --test tests/pricingV2.test.ts tests/pricingFeaturesV2.test.ts tests/termPricingPreview.test.ts tests/planSelectionV2.test.ts tests/planConfirmation.test.ts tests/creditPeriodsV2.test.ts
      - run: node script/build.mjs
